name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # タグのプッシュ時にリリースの下書きを作るため

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            # 前のリリースとの差分更新も作る
            ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME -DownloadPrevious
          } else {
            ./scripts/package.ps1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: WinPopCast-win-x64
          path: |
            artifacts/*.zip
            artifacts/velopack/*

      # インストーラー・ポータブル版・更新用ファイルをリリースの下書きに載せる。
      # 下書きを公開すると、インストール済みのアプリが更新を見つけるようになる
      - name: Release draft (tag)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o artifacts/velopack
          --tag ${{ github.ref_name }}
          --releaseName "WinPopCast ${{ github.ref_name }}"
